<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I love you</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,166.667vh);height:min(60vw,100vh)}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:2;cursor:pointer}
  #start button{font:600 22px Georgia,serif;color:#cfe8ff;background:none;border:1px solid #4682b4;border-radius:40px;padding:16px 36px;box-shadow:0 0 24px #1e90ff55;cursor:pointer}
</style>
</head>
<body>
<div id="start"><button>Открыть ♥</button></div>
<canvas id="c" width="2000" height="1200"></canvas>
<audio id="a" src="love_you.mp3" preload="auto"></audio>
<script>
const W = 2000, H = 1200, SCALE = 20;
const WORDS = ["love you", "Love You", "LOVE YOU"];
const COLORS = [[70,130,180],[30,144,255],[0,191,255],[100,149,237],[65,105,225]];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function heartXY(t) {
  const x = 16 * Math.sin(t) ** 3;
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return [x, -y];
}
const toScreen = (x, y) => [x * SCALE + W / 2, y * SCALE + H / 2];

function makeSprite(word, color, px) {
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.font = `bold ${px}px Arial, Helvetica, sans-serif`;
  c.width = Math.ceil(ctx.measureText(word).width) + 2;
  c.height = Math.ceil(px * 1.3);
  ctx.font = `bold ${px}px Arial, Helvetica, sans-serif`;
  ctx.fillStyle = `rgb(${color})`;
  ctx.textBaseline = "middle";
  ctx.fillText(word, 1, c.height / 2);
  return c;
}

function makeParticle(x, y, order, kind) {
  const base = kind === "outline" ? 20 : 17;
  const color = pick(COLORS);
  return {
    x, y, order, kind, alpha: 0, delay: 0,
    flicker: rnd(0, Math.PI * 2),
    sprite: makeSprite(pick(WORDS), color, Math.round(base * rnd(0.85, 1.15) * 1.25)),
  };
}

function buildOutline(n, gap = 30) {
  const out = [], placed = [];
  for (let i = 0; i < n; i++) {
    const [bx, by] = heartXY(i / n * 2 * Math.PI);
    const [sx, sy] = toScreen(bx, by);
    if (placed.some(([px, py]) => Math.hypot(sx - px, sy - py) < gap)) continue;
    placed.push([sx, sy]);
    out.push(makeParticle(sx, sy, i, "outline"));
  }
  return out;
}

function buildFill(n, gap = 46) {
  const out = [], placed = [];
  let attempts = 0;
  while (out.length < n && attempts++ < n * 80) {
    const [bx, by] = heartXY(rnd(0, Math.PI * 2));
    const r = rnd(0, 0.86);
    const [sx, sy] = toScreen(bx * r, by * r);
    if (placed.some(([px, py]) => Math.hypot(sx - px, sy - py) < gap)) continue;
    placed.push([sx, sy]);
    out.push(makeParticle(sx, sy, Math.floor(rnd(0, 321)), "fill"));
  }
  return out;
}

const outline = buildOutline(160), fill = buildFill(130);
const outlineSpan = Math.max(...outline.map(p => p.order));
const fillStart = Math.floor(outlineSpan * 1.6) + 30;
outline.forEach(p => p.delay = Math.floor(p.order * 1.6));
fill.forEach(p => p.delay = fillStart + p.order);
const particles = outline.concat(fill);

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const CENTER = " Love You ";
const centerStart = fillStart + 200;
let frame = 0;

function drawSprite(s, x, y, scale, alpha) {
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  const w = s.width * scale, h = s.height * scale;
  ctx.drawImage(s, x - w / 2, y - h / 2, w, h);
}

function step() {
  frame++;
  for (const p of particles) {
    if (frame > p.delay && p.alpha < 255) p.alpha = Math.min(255, p.alpha + 14 + Math.floor(rnd(0, 5)));
  }
}

function render() {
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  const alphas = particles.map(p => {
    const flick = p.alpha >= 255 ? 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker) : 1;
    return Math.floor(p.alpha * flick);
  });
  particles.forEach((p, i) => {
    const a = alphas[i];
    if (a <= 0) return;
    if (a > 10) {
      drawSprite(p.sprite, p.x, p.y, 2.4, a / 7 / 255);
      drawSprite(p.sprite, p.x, p.y, 1.6, a / 3 / 255);
    }
  });
  particles.forEach((p, i) => { if (alphas[i] > 0) drawSprite(p.sprite, p.x, p.y, 1, alphas[i] / 255); });

  if (frame > centerStart) {
    const progress = Math.min(1, (frame - centerStart) / 60);
    const ca = 1 - Math.exp(-progress * 8);
    const pulse = 1 + 0.025 * Math.sin(frame * 0.05);
    ctx.font = `bold ${Math.round(54 * 1.3 * pulse)}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgb(255,250,245)";
    ctx.globalAlpha = ca * 0.2;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1.4, 1.4); ctx.fillText(CENTER, 0, 0); ctx.restore();
    ctx.globalAlpha = ca;
    ctx.fillText(CENTER, W / 2, H / 2);
  }
  ctx.globalAlpha = 1;
}

let last = 0, acc = 0;
function loop(t) {
  if (!last) last = t;
  acc += Math.min(t - last, 100);
  last = t;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}

document.getElementById("start").addEventListener("click", function () {
  this.remove();
  const a = document.getElementById("a");
  a.play().catch(() => {});
  requestAnimationFrame(loop);
});
render();
</script>
</body>
</html>
